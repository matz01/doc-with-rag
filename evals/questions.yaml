# Evaluation set for the Quillmoor Software document assistant.
#
# Fields
#   id               unique identifier
#   category         single-doc | multi-doc | conflicting-versions | permission-denied |
#                    permission-partial | unanswerable
#   user             user id from data/users.yaml; answers must respect this user's permissions
#   question         the question as the user would type it
#   expected_answer  reference answer, for human review and LLM-as-judge grading
#   key_facts        strings that a correct answer must contain (deterministic check)
#   expected_sources documents that contain the answer
#   source_match     any: at least one expected source must be retrieved
#                    all: every expected source must be retrieved (multi-doc questions)
#   must_not_contain strings that must NOT appear in the answer (outdated values or leaked data)
#   forbidden_sources documents that must never be retrieved for this user

questions:

  # ---------------------------------------------------------------- single-doc
  - id: S01
    category: single-doc
    user: david.lindqvist
    question: Which laptop do engineers get, and how often is it replaced?
    expected_answer: Engineers get a MacBook Pro 14", replaced every 3 years (or earlier if faulty).
    key_facts: ["MacBook Pro", "3 years"]
    expected_sources: [it-equipment-faq]
    source_match: any

