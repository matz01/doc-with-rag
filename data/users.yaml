# Fictional users and groups for Quillmoor Software.
# Access model: a user can read a document only if they belong to at least one
# of the document's `allowed_groups` (see manifest.yaml). There is no implicit
# inheritance: executives and managers only see what is explicitly granted.

groups:
  all_staff: Every employee
  hr: People & Culture team
  sales: Sales team
  finance: Finance team
  engineering: Engineering team
  managers: People managers across departments
  executives: Leadership team

